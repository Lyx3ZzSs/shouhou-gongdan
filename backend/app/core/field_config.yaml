# 服务工单审核字段配置 — 前后端共享的单一数据源
# 后端使用此文件生成 ALLOWED_FIELDS + 字段元数据
# 前端对应 converters.ts 中的 FIELD_MAPPING
# 增删改字段只需修改此文件，前后端自动同步

groups:
  - id: basic
    name: 基本信息
  - id: category
    name: 工单分类
  - id: project
    name: 客户与项目
  - id: service_period
    name: 服务周期
  - id: description
    name: 问题描述
  - id: feedback
    name: 反馈信息
  - id: handling
    name: 处理信息
  - id: system
    name: 系统信息

# 审核规则参数。分类父子映射需由销售易权威字典生成；未配置时只校验层级完整性。
review_rules:
  special_order_types: ["2", "4", "5", "6", "7", "11"]
  urgent_problem_levels: ["2"]
  high_risk_problem_type2: ["3", "6", "7"]
  high_risk_problem_type3: ["40"]
  high_risk_keywords:
    - AGC拉停
    - AGC 拉停
    - 倒塔
    - 失电
    - 全站停电
    - 脱网
    - 解列
    - 二次安防
    - 功率控制异常
  category_parents:
    problemType2__c: {}
    problemType3__c: {}

fields:
