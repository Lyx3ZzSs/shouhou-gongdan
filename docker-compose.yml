# 售后工单审核系统 — 开发环境基础设施
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v

services:
  postgres:
    image: postgres:16-alpine
    container_name: shouhou-gongdan-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: JvUcMbDxjYY4M8sj
      POSTGRES_DB: shouhou_gongdan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema_init.sql:/docker-entrypoint-initdb.d/01_schema_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shouhou_gongdan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shouhou-gongdan-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
